[package]
name = "radium-launcher"
version = "4.0.0"
description = "Radium — Custom Rec Room Private Server Launcher"
authors = ["abod124-sudo"]
edition = "2021"

[lib]
name = "radium_launcher_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "json", "multipart", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
# The per-file checksums "Verify game files" compares against (verify.rs):
# the same CRC-32 a zip records for each file. Already built for `zip`.
crc32fast = "1.5"
# Inflating a damaged file straight off a download stream, for a repair from a
# server that only sends whole files (verify.rs). Already built for `zip`.
flate2 = "1"
regex = "1"
futures-util = "0.3"
# Stella's notification hub (friends' presence) is a SignalR websocket.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# Integrity checks on the two things this launcher downloads and then executes:
# the game client zip and its own installer. See download.rs / updater.rs.
sha2 = "0.10"
# The launcher's own updates are signed with a key that never leaves the
# developer's PC, and an installer that doesn't verify is not run (updater.rs).
# The same verifier, and the same signature format, as Tauri's own updater.
minisign-verify = "0.2"
base64 = "0.22"
rfd = "0.15"
# Wipes the Vanilla session cookie from memory when it is dropped.
zeroize = "1"
# Decode/resize/re-encode only. Default features pull in every format there is;
# the images this touches are the PNGs and JPEGs the two networks serve.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Stella's game API authenticates with a Steam auth-session ticket (the launcher
# signs in the same way the client does). This wraps the Steamworks SDK to get
# that ticket; it needs steam_api64.dll beside the exe and Steam running. See
# stella_api.rs.
steamworks = "0.13"
# Rec EOS releases are signed with ECDSA P-256 (receos.rs), the same check the
# mod's in-game updater makes.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # DPAPI, which encrypts the stored Vanilla session to the Windows user.
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    # Showing the notification pop-up without taking focus from the game.
    "Win32_UI_WindowsAndMessaging",
    # The per-user "Run" value that starts the launcher with Windows.
    "Win32_System_Registry",
    # Free disk space before downloading Vanilla's game.
    "Win32_Storage_FileSystem",
    # The tray icon's size at the current display scaling, and loading the
    # window icon at the sizes Windows actually draws.
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    # Capturing the screen behind the frosted tray menu and pop-up.
    "Win32_Graphics_Gdi",
    # Windows 11's rounded corners on the undecorated main window.
    "Win32_Graphics_Dwm",
    # Loading Stella's patch into the game it starts (stella.rs).
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }

# Optimise dependencies even in dev builds, while leaving this crate itself
# unoptimised so an edit still recompiles quickly.
#
# Without this, `npm run dev` runs the `image` crate and its PNG inflate at
# opt-level 0, where downscaling one 2560x1440 room thumbnail takes 1.36 s
# against 0.10 s built with optimisations — measured 2026-09-10 on the same
# file. A grid of twelve cards is the difference between a moment of work and
# a visibly stuttering desktop. Dependencies are compiled once and cached, so
# this costs one slow rebuild and nothing after it.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
