[package]
name = "receos-proton-helper"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus", "Win32_Storage_FileSystem",
] }

[workspace]
